<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palbato - Pokemon Style Battle</title>
    <style>
        body {
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: monospace;
        }
        #game-container {
            position: relative;
            width: 720px; /* 240 * 3 */
            height: 480px; /* 160 * 3 */
            border: 4px solid #444;
        }
        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        #ui-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30%;
            display: flex;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .move-btn {
            width: 50%;
            height: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #666;
            box-sizing: border-box;
            font-size: 20px;
            cursor: pointer;
            pointer-events: auto;
        }
        .move-btn:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
            <div id="move-0" class="move-btn"></div>
            <div id="move-1" class="move-btn"></div>
            <div id="move-2" class="move-btn"></div>
            <div id="move-3" class="move-btn"></div>
        </div>
    </div>
    <script src="assets/main.js"></script>
</body>
</html>
